# CI: lint, tests, numbers lock, marketplace consistency and the secret/data scan.
# Runs on every push and pull request. Offline: no test touches the network, and no
# data is downloaded (fetch is exercised against local fixtures only).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: make lint PY=python
      - name: Tests (pytest, no network)
        run: make test PY=python
      - name: Numbers lock (strict)
        run: make lock-check PY=python STRICT=1
      - name: Marketplace (strict)
        run: make marketplace-check PY=python STRICT=1
      - name: Secret, data and model-id scan
        run: make secrets PY=python
