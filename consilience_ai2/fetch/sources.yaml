# Pinned data sources for consilience-ai2.
#
# `consilience-ai2 fetch <name>|all` downloads each source into the local cache and
# verifies it before use; nothing here is ever stored in this repository.
#
#   cache root: $CONSILIENCE_AI2_DATA if set, else ~/.cache/consilience-ai2
#   path:       where the source lives under the cache root
#
# kind: file  -> one file, verified by its SHA-256 (and size). A mismatch is refused
#                and the partial download is deleted. `extract: true` unpacks a zip
#                next to it (into `path` without the .zip suffix) after verification.
# kind: git   -> a git repository checked out at a pinned commit; the commit SHA is
#                the integrity check (`git rev-parse HEAD` must equal `commit`).
#
# Every source is an Ai2 (or Ai2-collaborator) release, used under its own licence and
# credited in NOTICE. Data is downloaded by each user, never redistributed.
#
# `manual` says what to do when a direct download fails (Google Drive can change its
# confirmation flow); `consilience-ai2 fetch --from-dir DIR` then picks the file up from
# a local folder and verifies it exactly as a download would be.

schema_version: 1
cache_env: CONSILIENCE_AI2_DATA
default_cache: ~/.cache/consilience-ai2

sources:
  - name: codescientist
    kind: git
    url: https://github.com/allenai/codescientist.git
    commit: 778b146acf454d9400ed09fc1eb95d3d5cbb6a14
    path: git/codescientist
    licence: Apache-2.0
    used_for: "reviews/ (external review ratings), metaanalysis/ (bulk and per-idea rerun tables), data/"
    citation: >-
      Jansen, P., Tafjord, O., Radensky, M., Siangliulue, P., Hope, T., Dalvi Mishra, B.,
      Majumder, B. P., Weld, D. S. and Clark, P. (2025). CodeScientist: End-to-End
      Semi-Automated Scientific Discovery with Code-based Experimentation. Findings of
      the Association for Computational Linguistics: ACL 2025. arXiv:2503.22708.

  - name: codescientist-example-experiments
    kind: file
    url: https://drive.usercontent.google.com/download?id=1KJDzCIf5G7ZSqOpUivlUva1oNzp1ubyx&export=download&confirm=t
    page: https://drive.google.com/file/d/1KJDzCIf5G7ZSqOpUivlUva1oNzp1ubyx/view
    sha256: 21d2b98599dca158986f75712bde9b928edaa5ccc708438aba8c6c6d2df39c40
    size: 54640091
    path: codescientist/example_experiments.zip
    local_names: [example_experiments.zip, codescientist-example-experiments.zip]
    extract: true
    licence: "Apache-2.0 (linked from the CodeScientist repository; the archive carries no separate licence)"
    used_for: "the 20 Table-4 experiment directories (plans, code, logs, results.json, report.tex)"
    citation: >-
      CodeScientist example experiments archive, linked from
      allenai/codescientist example_experiments/README.md at commit 778b146.
    manual: >-
      Open the `page` URL in a browser, download the zip, then run
      `consilience-ai2 fetch codescientist-example-experiments --from-dir <download folder>`.

  - name: codescientist-full50
    kind: file
    url: https://drive.usercontent.google.com/download?id=1lDKtKBMNgzZpZiX4Xqm3C0H5txneSEat&export=download&confirm=t
    page: https://drive.google.com/file/d/1lDKtKBMNgzZpZiX4Xqm3C0H5txneSEat/view
    sha256: e0cd9d5ac32a859171c11d7a1f3b88b5525d9ca674ed40e6c6197ebcd1cc433a
    size: 607151022
    path: codescientist/full50.zip
    local_names: [full50.zip]
    # About 7 GB unzipped: read it in place with zipfile, or extract with --extract.
    extract: false
    licence: "Apache-2.0 (linked from the CodeScientist repository; the archive carries no separate licence)"
    used_for: "the completed experiments of the main run: 50 ideas x 5 runs (code, logs, results.json, report.tex)"
    citation: >-
      CodeScientist generated-experiments archive (full 50-idea run), linked from
      allenai/codescientist generated-experiments/README.md at commit 778b146.
    manual: >-
      Open the `page` URL in a browser (Drive asks to confirm a large file), download the
      zip, then run `consilience-ai2 fetch codescientist-full50 --from-dir <download folder>`.

